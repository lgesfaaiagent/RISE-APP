<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="rise-api" content="https://script.google.com/macros/s/AKfycbwBpICxeFjmXPc9YcwOE0iyGabD7Bemh-qCJPfTucQBRiIAUiGAxE6NHox6Nakyi6_6Fw/exec">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RISE">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RISE Gyuni-Gyuni Fam</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 디자인: 시간에 따라 바뀌는 하늘(새벽·낮·밤)이 홈의 얼굴이고, 나머지는 흰 면과 가는 선으로 조용하게.
   색은 네 가지 기록의 표식으로만 쓴다(운동 주황, 용돈 노랑, 성장 초록, 공부 남보라). 글자는 프리텐다드 한 가지, 도장만 주아체. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f1f2f5;
  --ink:#141824; --ink-2:#4a5162; --muted:#858b9b; --line:#e7e9ee;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:#ffefe9;
  --run:#ff5a36; --pay:#e39700; --body:#0fa678; --study:#5b5bd6;
  --run-bg:#ffe8dd; --pay-bg:#fff0c2; --body-bg:#d8f3e6; --study-bg:#e6e3ff;
  --cal:#0b8ea6; --cal-bg:#d7f0f5;
  --map-sea:#c3d9e5; --map-sea2:#dfecf2; --map-land:#f6f1e6; --map-line:#bdb6a6; --map-hover:#ece3cd; --map-vis:#ffd3a1; --map-sel:#ffbd73;
  --good:#0b8a4a;
  --paper:#fffdf6; --ink-red:#e0463c; --ink-blue:#2f5fd0; --ink-violet:#6a47c9;
  --m1:#2f6fed; --m2:#eda100; --m3:#0c8f4a; --m4:#e56aa0;
  --shadow:0 1px 2px rgba(20,24,36,.04),0 6px 20px rgba(20,24,36,.045);
  --float:0 2px 6px rgba(20,24,36,.06),0 16px 40px rgba(20,24,36,.12);
  --r:22px;
  --text:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --stampfont:"Jua","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
/* 밤 모드: 홈의 해·달 단추로 바꾼다(기기마다 기억). 처음에는 기기 설정을 따른다. */
:root[data-theme="dark"]{
  --bg:#0c0e14; --surface:#161922; --surface-2:#20242f;
  --ink:#f3f4f7; --ink-2:#c3c7d1; --muted:#8a90a0; --line:#272b37;
  --accent:#ff7a5c; --accent-ink:#1d0a05; --accent-soft:#33211d;
  --run:#ff7a5c; --pay:#e0a21a; --body:#2cc48c; --study:#9a9aff;
  --run-bg:#33201b; --pay-bg:#322913; --body-bg:#132c22; --study-bg:#212246;
  --cal:#3cc0d6; --cal-bg:#11303a;
  --map-sea:#0f2a3a; --map-sea2:#16405a; --ct-as:#34373a; --ct-eu:#323834; --ct-af:#37352f; --ct-na:#303735; --ct-sa:#343731; --ct-oc:#373331; --ct-x:#333333; --map-vis2:#b8742c; --map-sel2:#d4822a; --map-vis3:#f0a020; --map-sel3:#ff8a1f; --map-land:#2a3644; --map-line:#43566a; --map-hover:#33435a; --map-vis:#6b4a2a; --map-sel:#8a5a2c;
  --good:#3fcf85;
  --paper:#f6f1e3;
  --m1:#3987e5; --m2:#c98500; --m3:#008300; --m4:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.2);
  --float:0 2px 6px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
html.theming *,html.theming *::before,html.theming *::after{transition:background-color .5s ease,border-color .5s ease,color .5s ease,fill .5s ease,stroke .5s ease!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:break-word;padding-inline:16px;padding-block:0 108px;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
h1,h2,h3,p,ul,ol,fieldset,legend{margin:0;padding:0}
ul,ol{list-style:none}
fieldset{border:0;min-width:0}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1040px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}

/* 머리 */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 0}
.brand{display:flex;align-items:flex-start;gap:6px;min-width:0;flex:1}
.brand h1{font-weight:900;font-size:24px;line-height:1;letter-spacing:.2em;white-space:nowrap;display:flex;align-items:baseline;gap:10px}
.brand h1 small{font-weight:500;font-size:13.5px;letter-spacing:.01em;color:var(--muted)}
@media (max-width:600px){.brand h1{flex-direction:column;align-items:flex-start;gap:4px;font-size:21px}.brand h1 small{font-size:12px}}
.sync{width:7px;height:7px;border-radius:50%;background:var(--body);flex:0 0 auto;margin-top:2px}
.sync.busy{background:var(--pay);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.who{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.mechip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px 3px 3px;font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap}
.mechip.guest{padding:9px 14px;color:var(--ink-2)}
.who .gear{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);padding:0}
.who .gear svg{width:18px;height:18px}

/* 메뉴 */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:20;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid var(--line);box-shadow:var(--float);border-radius:24px;display:flex;justify-content:space-between;padding:6px;max-width:500px;margin-inline:auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:18px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2);font-weight:700}
@media (min-width:860px){
  body{padding-block:0 56px}
  .tabs{position:static;max-width:none;margin:0;align-self:flex-start;gap:2px;padding:5px;border-radius:16px;-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface);box-shadow:none}
  .tabs button{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 18px;font-size:14.5px;border-radius:12px}
  .tabs button svg{width:18px;height:18px}
}

/* 공통 */
#view{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3,.sec-title{font-weight:800;font-size:18px;line-height:1.25;letter-spacing:-.02em}
.panel .sub{color:var(--muted);font-size:13px;margin-top:-10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;align-items:start}
.trends{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:stretch}
@media (min-width:720px){.trends{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px;align-items:start}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note b{color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.hint{color:var(--muted);font-size:13px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h2{font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.ico{--c:var(--ink);width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--c) 13%,var(--surface));display:inline-grid;place-items:center;flex:0 0 auto}
.ico svg{width:20px;height:20px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.run{--c:var(--run)}.ico.pay{--c:var(--pay)}.ico.body{--c:var(--body)}.ico.study{--c:var(--study)}

.btn{border:0;background:var(--surface-2);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--ink);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.big{padding:15px 22px;font-size:16px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13px;font-weight:600;border-radius:10px}
.btn.ghost{background:none;color:var(--muted);padding:6px 8px;font-weight:600}
.btn[data-armed]{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.2;color:var(--ink-2)}
button.chip[aria-pressed="true"],.chip:has(input:checked){background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.chip.who{padding:4px 14px 4px 4px}
.seg{display:inline-flex;border-radius:11px;background:var(--surface-2);padding:3px}
.seg button{border:0;background:none;padding:6px 13px;font-size:13px;font-weight:600;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,36,.12)}

/* 얼굴: 사진이 없으면 닉네임을 그대로 보여 준다 */
.av{--mc:var(--m1);width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:inline-grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--mc) 16%,var(--surface));box-shadow:inset 0 0 0 2px var(--mc);color:var(--ink);container-type:size}
.av b{font-weight:800;line-height:1;letter-spacing:-.04em;white-space:nowrap;font-size:17px;font-size:42cqw}
.av b.n2{font-size:14px;font-size:33cqw}
.av b.n3{font-size:11px;font-size:25cqw}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;padding:2px}
.av.s{width:34px;height:34px;box-shadow:inset 0 0 0 1.5px var(--mc)}.av.s img{padding:1.5px}
.av.l{width:76px;height:76px}

/* 홈의 하늘: 낮 장면과 밤 장면을 겹쳐 두고, 오른쪽 위 해·달 단추로 넘긴다 */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:28px;background:#1f5fe0;color:#fff;padding:22px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;box-shadow:var(--shadow)}
.scene{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden;transition:opacity .9s ease}
.scene.day{background:radial-gradient(58% 92% at 100% 0%,rgba(255,232,150,.62) 0%,rgba(255,214,110,.2) 36%,rgba(255,214,110,0) 62%),linear-gradient(180deg,#1653d6 0%,#2f7bf0 56%,#57a2fb 100%)}
.scene.night{opacity:0;background:radial-gradient(60% 84% at 96% -6%,rgba(160,140,255,.52) 0%,rgba(90,80,200,0) 62%),radial-gradient(80% 62% at 8% 122%,rgba(60,200,190,.24) 0%,rgba(60,200,190,0) 60%),linear-gradient(180deg,#060919 0%,#131a48 58%,#2b2868 100%)}
[data-theme="dark"] .scene.day{opacity:0}
[data-theme="dark"] .scene.night{opacity:1}
.scene .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:48%}
.cloud{position:absolute;width:86px;height:26px;border-radius:999px;background:#fff;opacity:.2;animation:drift 46s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:#fff}
.cloud::before{width:34px;height:34px;left:13px;top:-15px}
.cloud::after{width:44px;height:42px;right:11px;top:-22px}
.cloud.c1{top:30%;right:20%}
.cloud.c2{top:58%;left:40%;scale:.62;opacity:.13;animation-duration:64s}
@keyframes drift{to{translate:36px 0}}
.stars,.stars::after{content:"";position:absolute;inset:0;background-repeat:no-repeat}
.stars{background-image:radial-gradient(1.7px 1.7px at 7% 22%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 19% 60%,#fff 98%,transparent),radial-gradient(1.7px 1.7px at 31% 13%,#fff 98%,transparent),radial-gradient(1px 1px at 45% 42%,#fff 98%,transparent),radial-gradient(1.7px 1.7px at 60% 17%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 73% 48%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 34%,#fff 98%,transparent);animation:twinkle 4.6s ease-in-out infinite alternate}
.stars::after{background-image:radial-gradient(1.2px 1.2px at 13% 40%,#fff 98%,transparent),radial-gradient(1px 1px at 26% 30%,#fff 98%,transparent),radial-gradient(1.4px 1.4px at 39% 62%,#fff 98%,transparent),radial-gradient(1px 1px at 52% 9%,#fff 98%,transparent),radial-gradient(1.4px 1.4px at 67% 34%,#fff 98%,transparent),radial-gradient(1px 1px at 81% 12%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 94% 56%,#fff 98%,transparent);animation:twinkle 6.2s ease-in-out infinite alternate-reverse}
@keyframes twinkle{from{opacity:.3}to{opacity:.95}}
.daynight{position:absolute;top:14px;right:14px;z-index:2;width:66px;height:34px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);padding:0;overflow:hidden;background:linear-gradient(180deg,#4aa8ff,#a4dbff);box-shadow:0 2px 10px rgba(10,20,60,.28);transition:background .6s}
.daynight i{position:absolute;display:block}
.daynight .knob{top:3.5px;left:4px;width:24px;height:24px;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 3px rgba(255,216,77,.38),0 0 14px rgba(255,216,77,.95);overflow:hidden;transition:transform .6s cubic-bezier(.5,1.5,.5,1),background .6s,box-shadow .6s}
.daynight .knob::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#1a1f55;top:-4px;left:9px;transform:translate(22px,-14px);transition:transform .6s}
.daynight .pc{right:8px;bottom:6px;width:19px;height:7px;border-radius:9px;background:#fff;transition:transform .6s,opacity .6s}
.daynight .pc::before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;left:5px;top:-5px}
.daynight .ps{left:11px;top:8px;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:9px 10px 0 0 #fff,17px 1px 0 0 #fff,4px 15px 0 -.3px #fff,22px 13px 0 -.3px #fff;opacity:0;transform:translateY(-10px);transition:transform .6s,opacity .6s}
[data-theme="dark"] .daynight{background:linear-gradient(180deg,#0c1033,#2a2f74)}
[data-theme="dark"] .daynight .knob{transform:translateX(31px);background:#f6f2ff;box-shadow:0 0 0 3px rgba(246,242,255,.16),0 0 12px rgba(200,190,255,.75)}
[data-theme="dark"] .daynight .knob::after{transform:none}
[data-theme="dark"] .daynight .pc{transform:translateY(16px);opacity:0}
[data-theme="dark"] .daynight .ps{opacity:.9;transform:none}
.hero h2{font-weight:800;font-size:24px;line-height:1.22;letter-spacing:-.03em;text-wrap:balance;padding-right:76px;text-shadow:0 1px 4px rgba(10,20,70,.25)}
.hero .when{font-size:13.5px;opacity:.9;margin-top:6px;text-shadow:0 1px 3px rgba(10,20,70,.3)}
.ticker{display:flex;flex-direction:column;gap:6px;min-width:0}
.ticker li{display:flex;align-items:center;gap:8px;min-width:0;min-height:34px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:3px 14px 3px 4px;font-size:13.5px}
.ticker li.nop{padding-left:14px}
.ticker .av{width:26px;height:26px;box-shadow:none}
.ticker .av img{padding:0}
.ticker b{font-weight:800;white-space:nowrap;flex:0 0 auto}
.ticker em{font-style:normal;font-size:12px;opacity:.78;white-space:nowrap;flex:0 0 auto}
.ticker .tx{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-weight:500}
.ticker .tx.flow{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.ticker .runner{display:inline-flex;animation:marquee 12s linear infinite;will-change:transform}
.ticker .runner span{padding-right:56px}
@keyframes marquee{to{transform:translateX(-50%)}}
.ticker .tk-new{flex:1;border:0;background:none;color:#fff;text-align:left;font-weight:600;font-size:13.5px;padding:4px 0}
@media (prefers-reduced-motion:reduce){.ticker .runner,.cloud,.stars,.stars::after{animation:none}.ticker .tx.flow{overflow-x:auto}}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rings li{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.ring{position:relative;width:min(100%,88px);aspect-ratio:1;border:0;background:none;padding:0;display:grid;place-items:center;margin-bottom:4px}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .tr{fill:none;stroke:rgba(255,255,255,.24);stroke-width:5}
.ring .pg{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round}
.ring.ok .pg{stroke:#ffe27a}
.ring .av{width:70%;height:70%;box-shadow:none;background:rgba(255,255,255,.94);color:#141824}
.ring .av img{padding:0}
.ring .badge{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#ffe27a;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ring .badge svg{position:static;width:14px;height:14px;stroke:#5a3b00;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rings b,.rings span{text-shadow:0 1px 3px rgba(30,20,60,.35)}
.rings b{font-size:14.5px;font-weight:700}
.rings span{font-size:12.5px;opacity:.92;font-variant-numeric:tabular-nums}
.top2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;align-items:stretch;container-type:inline-size}
.top2 .framebox{aspect-ratio:auto;min-height:0;height:100%}
.top2 .sbar{flex-direction:column;align-items:stretch;gap:6px;padding:30px 10px 12px}
.top2 .sbtns{justify-content:flex-end}
.rings .stk{font-style:normal}
/* 넓은 화면: 하늘 상자 안을 다시 좌우로 */
@container (min-width:900px){
  .top2{gap:20px}
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,300px);grid-template-areas:"head rings" "tick rings";align-items:center;padding:30px 30px 26px;column-gap:26px}
  .hero-head{grid-area:head;align-self:end}.ticker{grid-area:tick;align-self:start}.rings{grid-area:rings;margin-top:26px}
  .hero h2{font-size:27px;padding-right:0}
  .top2 .hero{min-height:250px}
}

@keyframes kBld{0%,60%{stroke-dashoffset:8;opacity:0}60.1%{stroke-dashoffset:8;opacity:1}66%,97%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes kBdr{0%,69%{opacity:0;transform:translateY(0)}70%{opacity:1;transform:translateY(0)}78%{opacity:1;transform:translateY(11px)}78.5%,82%{opacity:0;transform:translateY(0)}83%{opacity:1;transform:translateY(0)}91%{opacity:1;transform:translateY(11px)}91.5%,100%{opacity:0;transform:translateY(0)}}
@keyframes kFlaL{from{transform:rotate(-9deg)}to{transform:rotate(11deg)}}
@keyframes kFlaR{from{transform:rotate(9deg)}to{transform:rotate(-11deg)}}
@keyframes kPfly{0%,66%{opacity:1;transform:translate(0,0) rotate(0)}80%{opacity:1;transform:translate(22px,-34px) rotate(300deg)}86%,100%{opacity:0;transform:translate(26px,-40px) rotate(360deg)}}
@keyframes kPq{0%,65%{opacity:0;transform:scale(.3)}69%{opacity:1;transform:scale(1.35)}73%,94%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.more{border:0;background:none;border-radius:10px;padding:6px 2px 6px 8px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:0}
.more svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:38px}
.big strong{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.big strong small{font-size:15px;font-weight:700;margin-left:2px;letter-spacing:0}
.big span{font-size:13px;color:var(--ink-2)}
.delta{background:var(--surface-2);border-radius:8px;padding:3px 9px;font-weight:700;font-size:12.5px!important;color:var(--ink)!important}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px 22px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.mini li{display:flex;align-items:baseline;gap:7px;font-size:13.5px;min-width:0}
.mini i{width:8px;height:8px;border-radius:50%;flex:0 0 auto;align-self:center}
.mini span{font-weight:700;white-space:nowrap}
.mini em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini b{font-weight:800;margin-left:auto;white-space:nowrap}

/* 스티커 */
.stamp{width:58px;height:58px;flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(20,24,36,.14))}
.stamp .paper{fill:var(--paper)}
.stamp .ring1{fill:none;stroke-width:2.6}.stamp .ring2{fill:none;stroke-width:1;stroke-dasharray:2 2.4}
.stamp text{font-family:var(--stampfont);font-size:13.5px;letter-spacing:0}
.ink-r .ring1,.ink-r .ring2{stroke:var(--ink-red)}.ink-r text{fill:var(--ink-red)}
.ink-b .ring1,.ink-b .ring2{stroke:var(--ink-blue)}.ink-b text{fill:var(--ink-blue)}
.ink-v .ring1,.ink-v .ring2{stroke:var(--ink-violet)}.ink-v text{fill:var(--ink-violet)}
.stamp.sm{width:52px;height:52px}
.sheetpaper{background-color:var(--surface);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:18px 18px}
.board li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0}
.board .stamps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:52px}
.board .name{font-weight:700;font-size:14.5px}
.cnt{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;text-align:center;font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt small{display:block;font-size:11.5px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:5px}
.stickergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
.stickergrid li{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2);line-height:1.3}

/* 소식 */
.feed{display:flex;flex-direction:column;gap:14px}
.feed li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:start}
.feed .t1{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.feed .t2{font-size:12.5px;color:var(--muted)}
.feed .bubble{--mc:var(--m1);display:inline-block;background:color-mix(in srgb,var(--mc) 12%,var(--surface));border-radius:4px 16px 16px 16px;padding:8px 13px;font-size:14.5px;font-weight:600}
.feed .r{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pill{background:var(--pay-bg);border-radius:8px;padding:3px 9px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* 숫자 · 미터 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tiles.lead{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.lead .tile:first-child{grid-column:1/-1}
.tile{background:var(--surface-2);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:25px;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.tile .v small{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:2px;letter-spacing:0}
.tile .d{font-size:12.5px;color:var(--ink-2)}
.goal{--mc:var(--m1);display:flex;flex-direction:column;gap:6px}
.goal .gl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.goal .gl b{font-weight:700}
.goal .gl span{color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--mc) 16%,var(--surface));overflow:hidden}
.meter i{display:block;height:100%;background:var(--mc);border-radius:4px}
.done{display:inline-flex;align-items:center;gap:3px;color:var(--good);font-weight:800}
.who-line{display:flex;align-items:center;gap:9px;font-weight:700}

/* 목록 · 표 */
.list{display:flex;flex-direction:column}
.list li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .t1{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.list .t2{font-size:12.5px;color:var(--muted)}
.list .r{display:flex;align-items:center;gap:2px;white-space:nowrap}
.list .amt{font-weight:800;font-variant-numeric:tabular-nums}
.list .amt.minus{color:var(--ink-2);font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12.5px;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left;padding-left:0}
td:last-child,th:last-child{padding-right:0}

/* 공부 */
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px}
.todo .box{width:32px;height:32px;border-radius:10px;border:2px solid color-mix(in srgb,var(--study) 40%,var(--line));display:grid;place-items:center}
.todo button[aria-pressed="true"]{background:var(--study-bg);border-color:transparent}
.todo button[aria-pressed="true"] .box{background:var(--study);border-color:var(--study)}
.todo .box svg,.cell svg{width:17px;height:17px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.todo button[aria-pressed="true"] .box svg,.cell[aria-pressed="true"] svg{visibility:visible}
.todo .t1{font-weight:700}.todo .t2{font-size:12.5px;color:var(--muted)}
.wk td,.wk th{text-align:center;padding:6px 3px}
.wk td:first-child,.wk th:first-child{text-align:left}
.wk td:first-child{white-space:normal;min-width:110px}
.cell{width:32px;height:32px;border-radius:10px;border:2px solid color-mix(in srgb,var(--study) 40%,var(--line));background:var(--surface);display:inline-grid;place-items:center;padding:0}
.cell[aria-pressed="true"]{background:var(--study);border-color:var(--study)}
.cell.future{opacity:.3}
.wk .off{color:var(--line)}
.wk th.today{color:var(--study);font-weight:800}

/* 그래프 */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:color-mix(in srgb,var(--ink) 8%,transparent);stroke-width:1}
.chart .axis{stroke:color-mix(in srgb,var(--ink) 22%,transparent);stroke-width:1}
.chart .tk{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:0}
.chart .val{fill:var(--ink);font-size:11.5px;font-weight:800;letter-spacing:0}
.chart .cross{stroke:color-mix(in srgb,var(--ink) 30%,transparent);stroke-width:1}
.chart .dot{stroke:var(--surface);stroke-width:2}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:10px;padding:8px 11px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:5;box-shadow:var(--float)}
.tip b{display:block}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* 입력 창 */
dialog{border:0;border-radius:26px;padding:0;background:var(--surface);color:var(--ink);width:min(540px,calc(100% - 20px));max-height:min(90dvh,780px);overflow:auto;box-shadow:var(--float)}
dialog::backdrop{background:rgba(10,12,22,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (max-width:600px){dialog{margin:auto auto 0;width:100%;max-width:100%;border-radius:26px 26px 0 0;max-height:92dvh}}
.sheet{padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet>form{display:flex;flex-direction:column;gap:16px}
.sheet h2{font-weight:800;font-size:22px;letter-spacing:-.03em}
.sheet h3{font-weight:800;font-size:17px;letter-spacing:-.02em}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>label,.f>legend{font-size:13px;color:var(--ink-2);font-weight:600}
.f>legend{margin-bottom:6px}
.f small{color:var(--muted);font-weight:500}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=password],.f select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:16px;min-height:46px}
.f input:focus,.f select:focus{outline:0;border-color:var(--ink);background:var(--surface)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input{flex:1;min-width:0}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.preview{background:var(--pay-bg);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600}
.people li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.people li:first-child{border-top:0}
.people .t1{font-weight:800;font-size:16.5px;letter-spacing:-.02em}.people .t2{font-size:13px;color:var(--ink-2)}
.tag{display:inline-block;background:var(--pay-bg);border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;margin-left:4px}
.photo-pick{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* 잠금 화면 */
#lock{position:fixed;inset:0;z-index:100;isolation:isolate;background:#1f5fe0;display:grid;place-items:center;padding:20px;overflow:hidden}

.lockhelp{font-size:13.500px;line-height:1.55;background:rgba(10,20,60,.35);border-radius:14px;padding:12px 14px;margin-top:6px;opacity:0;animation:lockhelp .4s 12s forwards}
@keyframes lockhelp{to{opacity:1}}
.lockbox{position:relative;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;color:#fff;text-align:center}
.lockbox h1{font-weight:900;font-size:58px;line-height:1;letter-spacing:.22em;margin-right:-.22em}
.lockbox h1 small{display:block;font-weight:500;font-size:17px;letter-spacing:.08em;margin-top:14px;margin-right:.22em;opacity:.9}
.lockbox p{font-size:14.5px;opacity:.88;margin-top:10px;text-wrap:balance}
.lockbox input[type=password]{border:1px solid rgba(255,255,255,.4);border-radius:16px;padding:15px;font-size:20px;text-align:center;letter-spacing:.24em;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;min-height:56px;width:100%}
.lockbox input[type=password]:focus{outline:0;border-color:#fff;background:rgba(255,255,255,.22)}
.lockbox input::placeholder{letter-spacing:0;font-size:15.5px;color:rgba(255,255,255,.75)}
.lockbox .keep{font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;opacity:.92}
.lockbox .keep input{width:18px;height:18px;accent-color:#fff}
.lockbox .btn{background:#fff;color:#141824;border-radius:16px;text-align:center;width:100%;display:block}
.lockbox .btn[disabled]{opacity:.6}
#lockerr{min-height:22px;font-weight:700;margin-top:0;opacity:1}

#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--float)}
#cheer{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(10,12,22,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);text-align:center}
#cheer div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;font-weight:800;font-size:24px;letter-spacing:-.02em;padding:16px}
#cheer .stamp{width:176px;height:176px;animation:thump .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes thump{from{transform:scale(2.4) rotate(-18deg);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#cheer .stamp,.sync.busy{animation:none}.btn,.quick button{transition:none}}
@media (max-width:420px){.row2{gap:10px}.panel{padding:18px 16px}.hero{padding:22px 14px 18px}.trend{padding:18px 16px}.wk td,.wk th{padding:6px 2px}.wk td:first-child{min-width:92px}.cell{width:28px;height:28px;border-radius:9px}}

/* 성장 칸: 한 사람에 한 장 */
.gcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gcard{--mc:var(--m1);background:color-mix(in srgb,var(--surface) 74%,transparent);border-radius:16px;padding:11px 12px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.gcard .gh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.gcard .gh i{width:8px;height:8px;border-radius:50%;background:var(--mc);flex:0 0 auto}
.gcard .gh em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.gcard .gv{font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.gcard .gv small{font-size:12px;font-weight:700;color:var(--ink-2);margin-left:1px;letter-spacing:0}
.gcard .gd{font-size:12px;color:var(--ink-2);min-height:18px}
.gcard .chart{margin-top:4px}
.gcard.lock{align-items:center;justify-content:center;text-align:center;color:var(--ink-2);font-size:13px;font-weight:700;min-height:124px;gap:6px}
.gcard.lock svg,.locknote svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.locknote{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:14px}
.btag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.btag.ok{background:var(--body-bg)}.btag.warn{background:var(--pay-bg)}.btag.hi{background:var(--run-bg)}
.ico.album{--c:var(--ink)}
.todo button:disabled,.cell:disabled{cursor:default;color:inherit;opacity:1}
.checkrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.checkrow input{width:20px;height:20px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ink)}

/* 누구로 들어갈까요 */
.whogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.whogrid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 8px 13px;font-weight:800;font-size:15.5px;color:var(--ink)}
.whogrid button small{font-size:12px;font-weight:600;color:var(--muted)}
.whogrid button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* 사진 · 앨범 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.pgrid button{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.pgrid img,.picks img,.acard .cover img{width:100%;height:100%;object-fit:cover;display:block}
img[data-th]:not([src]){visibility:hidden}
.albums{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:4px}
.albums::-webkit-scrollbar{display:none}
.acard{flex:0 0 112px;display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.acard .cover{display:grid;place-items:center;width:112px;height:112px;border-radius:20px;overflow:hidden;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:5px}
.acard .cover svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.acard b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}
.acard small{font-size:12px;color:var(--muted);white-space:nowrap}
.acard[aria-pressed="true"] .cover{box-shadow:0 0 0 3px var(--bg),0 0 0 5.500px var(--ink)}
.pcount{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--surface-2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;color:var(--ink-2);margin-right:2px}
.pcount svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.picks span{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.picks button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(10,12,22,.66);color:#fff;font-size:13px;line-height:1;padding:0}
.f input[type=file]{font-size:14px;max-width:100%}

/* 슬라이드 틀: 홈과 사진 화면 안에서 돌고, 전체 화면에서도 같은 모양 */
.framebox{position:relative;isolation:isolate;border-radius:28px;overflow:hidden;background:#0b0d16;aspect-ratio:16/11;box-shadow:var(--shadow);min-width:0}
.framebox.wide{aspect-ratio:16/10;max-height:68vh;width:100%}
@media (min-width:860px){.framebox.wide{aspect-ratio:2/1}}
#viewer{position:fixed;inset:0;z-index:80;background:#05060c}
.show{position:absolute;inset:0;color:#fff;background:#0b0d16;overflow:hidden}
.sstage{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.sl{position:absolute;inset:0;opacity:0;overflow:hidden}
.sl img{position:absolute;display:block;max-width:none}
.sl .bg{left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;filter:blur(26px) brightness(.55) saturate(1.2)}
.sl .fg{inset:0;width:100%;height:100%;object-fit:contain}
.sl img:not([src]){visibility:hidden}
.sl.on{opacity:1;z-index:1}
.a-fade,.a-kb{animation:sIn 1s ease both}
.o-fade,.o-kb,.o-zoom{animation:sOut 1s ease both}
.a-slide{animation:sSlideIn .9s cubic-bezier(.3,.8,.3,1) both}
.o-slide{animation:sSlideOut .9s cubic-bezier(.3,.8,.3,1) both}
.a-zoom{animation:sZoomIn 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes sIn{from{opacity:0}to{opacity:1}}
@keyframes sOut{from{opacity:1}to{opacity:0}}
@keyframes sSlideIn{from{transform:translateX(100%);opacity:1}to{transform:none;opacity:1}}
@keyframes sSlideOut{from{transform:none;opacity:1}to{transform:translateX(-100%);opacity:1}}
@keyframes sZoomIn{from{transform:scale(1.22);opacity:0}to{transform:none;opacity:1}}
.a-kb .fg{animation:kb0 var(--dur,7s) linear both}
.a-kb.kb1 .fg{animation-name:kb1}.a-kb.kb2 .fg{animation-name:kb2}.a-kb.kb3 .fg{animation-name:kb3}
@keyframes kb0{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes kb1{from{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes kb2{from{transform:scale(1.1) translateX(-2.500%)}to{transform:scale(1.1) translateX(2.500%)}}
@keyframes kb3{from{transform:scale(1.1) translateX(2.500%)}to{transform:scale(1.1) translateX(-2.500%)}}
.st-warm .fg{filter:sepia(.28) saturate(1.2) brightness(1.03)}
.st-vivid .fg{filter:saturate(1.35) contrast(1.06)}
.st-mono .fg{filter:grayscale(1) contrast(1.08)}
.st-mono .bg{filter:blur(26px) brightness(.55) grayscale(1)}
.st-film .fg{filter:contrast(1.1) saturate(.82) sepia(.16) brightness(1.02)}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none}
.st-film .vig{box-shadow:inset 0 0 90px 24px rgba(0,0,0,.5)}
.snav{position:absolute;top:0;bottom:0;width:26%;border:0;background:none;z-index:3;padding:0}
.snav.prev{left:0}.snav.next{right:0}
.smid{position:absolute;top:0;bottom:0;left:26%;right:26%;border:0;background:none;z-index:3;padding:0;cursor:zoom-in}
.show.full .smid{cursor:default}
.swait{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:12px;opacity:.78;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:flex-end;gap:8px;padding:34px 12px 12px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.66));pointer-events:none}
.sbar>*{pointer-events:auto}
.scap{flex:1;min-width:0;font-size:12.500px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.scap b,.scap span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scap b{font-size:14.500px;font-weight:700}
.scap span{opacity:.9;font-variant-numeric:tabular-nums}
.sbtns{display:flex;gap:6px;flex:0 0 auto}
.sbtn{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;padding:0;flex:0 0 auto}
.sbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbtn[aria-pressed="true"]{background:#fff;color:#141824}
.sbtn.txt{width:auto;border-radius:17px;padding:0 13px;font-size:13px;font-weight:700;white-space:nowrap}
.sprog{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:5;background:rgba(255,255,255,.16)}
.sprog i{display:block;height:100%;width:0;background:#fff}
.show.play .sprog i{animation:prog var(--sec,5s) linear both}
@keyframes prog{to{width:100%}}
.sempty{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;font-size:14px;font-weight:600;color:rgba(255,255,255,.9);background:radial-gradient(80% 70% at 85% 0%,rgba(150,130,255,.45),rgba(90,80,200,0) 62%),linear-gradient(180deg,#0d1235,#2b2868)}
.show.full .sbar{padding:44px 16px calc(16px + env(safe-area-inset-bottom,0px));flex-wrap:wrap}
.show.full .scap{font-size:13.500px;flex:1 1 200px}.show.full .scap b{font-size:16.500px}
.show.full .sbtn{width:40px;height:40px}.show.full .sbtn.txt{border-radius:20px}
@media (prefers-reduced-motion:reduce){.sl,.sl .fg{animation-duration:.01s!important}}
#manual{position:fixed;inset:0;z-index:90;background:#fbfaf6;overflow:auto;-webkit-overflow-scrolling:touch}
#manual .x{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:#141824;color:#fff;font-size:20px;line-height:1;padding:0;box-shadow:var(--float)}
/* 띄어쓰기 없이 길게 쓴 한마디가 말풍선을 화면 밖으로 밀어내지 못하게 한다(휴대폰 세로에서 화면이 좌우로 밀리던 까닭) */
.feed .bubble{max-width:100%;overflow-wrap:anywhere}
/* 혹시 다른 것이 삐져나와도 화면 전체가 옆으로 밀리지는 않게 막아 둔다 */
html{overflow-x:hidden;overflow-x:clip}
body{overflow-x:clip}

/* ---------- 일정(달력) ---------- */
.ico.cal{--c:var(--cal)}
.ico.sm{width:30px;height:30px;border-radius:10px}.ico.sm svg{width:17px;height:17px}
.calhome .head h3{display:flex;align-items:center;gap:9px;flex-wrap:wrap}

.cday{border:0;background:var(--surface-2);border-radius:10px;padding:5px 4px 6px;min-height:62px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-width:0;font:inherit;color:var(--ink);overflow:hidden;cursor:pointer}
.cgrid.month .cday{min-height:78px}
.cday .dn{font-size:12.5px;font-weight:700;line-height:1.25;display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.cday .dn em{font-style:normal;font-size:10px;color:var(--muted)}
.cday .lu{font-size:9px;font-weight:600;color:var(--muted);margin-left:auto;letter-spacing:-.02em}
.cday.sat .dn{color:#3b72d9}.cday.sun .dn{color:#e0463c}
.cgrid.two .cday.past{opacity:.5}
.cday.out{opacity:.36}
.cday.today{background:color-mix(in srgb,var(--cal) 15%,var(--surface));box-shadow:inset 0 0 0 2px var(--cal)}
.ce{--mc:var(--m1);display:block;font-size:10.5px;line-height:1.3;font-weight:700;color:color-mix(in srgb,var(--mc) 72%,#000);background:color-mix(in srgb,var(--mc) 16%,var(--surface));border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden}
.et{--mc:var(--m1);color:color-mix(in srgb,var(--mc) 72%,#000)}
:root[data-theme="dark"] .ce,:root[data-theme="dark"] .et{color:color-mix(in srgb,var(--mc) 58%,#fff)}
.cm{font-size:10px;font-weight:700;color:var(--muted);padding-left:3px}
/* 카테고리를 골랐을 때: 그 일정이 있는 날만 밝게 */
.cgrid.pick .cday.dim{opacity:.28}
.cgrid.pick .cday.hit{background:color-mix(in srgb,var(--cal) 15%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--cal) 60%,transparent);opacity:1}
.cgrid.pick .cday.out.hit{opacity:.7}
.calbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calm{font-size:18px;font-weight:800;letter-spacing:-.02em;min-width:108px;text-align:center}
.evl .edate{width:42px;text-align:center;flex:0 0 auto;display:flex;flex-direction:column;line-height:1.15}
.evl .edate b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.evl .edate span{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.evl .t1{overflow-wrap:anywhere}
.evl .tag{margin-left:0;background:var(--cal-bg)}
.pill.off{background:var(--surface-2);color:var(--muted)}
@media (max-width:420px){.cgrid{gap:3px}.cday{padding:4px 3px 5px;border-radius:8px}.ce{font-size:10px;padding:1px 3px}.cgrid.month .cday{min-height:70px}}
/* 가족 소식: 같이 한 운동은 한 줄, 사람 수를 작은 숫자로 */
.feed .avs{position:relative;display:inline-flex;align-self:start}
.feed .avs i{position:absolute;right:-5px;bottom:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:10.5px;font-weight:800;font-style:normal;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface)}
/* ---------- 체크 상자: 켜지면 색이 차고 굵은 체크가 보인다 (알약 모양 선택 칸 안의 것은 그 칸 전체가 바뀐다) ---------- */
input[type=checkbox]:not(.chip input){-webkit-appearance:none;appearance:none;width:24px;height:24px;margin:0;flex:0 0 auto;border:2px solid color-mix(in srgb,var(--ink) 40%,transparent);border-radius:7px;background:var(--surface) center/18px 18px no-repeat;vertical-align:middle;cursor:pointer;transition:background-color .12s,border-color .12s}
input[type=checkbox]:not(.chip input):checked{background-color:var(--accent);border-color:var(--accent);background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5 12.5l4.6 4.6L19.2 7.2' fill='none' stroke='white' stroke-width='3.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E")}
input[type=checkbox]:not(.chip input):focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=checkbox]:not(.chip input):disabled{opacity:.5;cursor:default}
.checkrow{align-items:flex-start;gap:11px;cursor:pointer}
.checkrow:has(input:checked) b{color:var(--accent)}
.lockbox .keep{cursor:pointer;gap:10px}
.lockbox .keep input[type=checkbox]{border-color:rgba(255,255,255,.85);background-color:rgba(255,255,255,.12)}
.lockbox .keep input[type=checkbox]:checked{background-color:var(--accent);border-color:#fff}
.lockbox .keep:has(input:checked){opacity:1;font-weight:700}
.chip:not(.who):has(input[type=checkbox]:checked) span::before{content:"✓";font-weight:900;margin-right:5px}
.srvwarn{position:sticky;top:0;z-index:70;background:#b42318;color:#fff;padding:10px 16px;font-size:13.5px;line-height:1.5;text-align:center;overflow-wrap:anywhere}
.srvwarn b{font-weight:800}
.older{margin-top:12px;text-align:center}
.older .hint{margin-top:6px}
/* 머리(이름·프로필·설정)는 늘 위에 고정. 넓은 화면은 메뉴도 같이 고정. (bar 에 backdrop-filter 를 주면 폰 아래 메뉴가 따라 움직이므로 쓰지 않는다) */
.bar{position:sticky;top:0;z-index:30;margin-inline:-16px;padding:env(safe-area-inset-top,0px) 16px 12px;background:var(--bg);display:flex;flex-direction:column;gap:14px;transition:box-shadow .2s}
.bar.stuck{border-bottom:1px solid var(--line)}
.bar .top{padding-block:12px 0}
@media (min-width:860px){.bar{gap:12px;box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax -1px)}}
/* 사진: 맨 위 세 칸(모든 사진·운동 사진·앨범 폴더) */
.ptop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:420px}
.ptop .acard{flex:none}
.ptop .acard .cover{width:100%;height:auto;aspect-ratio:1}
.ptop .acard b{max-width:100%}
.acard.fold .cover{background:color-mix(in srgb,var(--pay,#eda100) 22%,var(--surface-2));padding:7px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%;height:100%}
.fgrid img,.fgrid i{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:2px;border:0;background:none;padding:0;text-align:left;color:var(--ink);min-width:0}
.fcard .cover{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--surface-2);color:var(--muted);margin-bottom:5px;box-shadow:inset 0 0 0 1px var(--line)}
.fcard .cover::before{content:"";position:absolute;inset:-1px auto auto 10px;width:44%;height:12px;border-radius:0 0 8px 8px;background:color-mix(in srgb,var(--pay,#eda100) 70%,transparent);z-index:1}
.fcard .cover img{width:100%;height:100%;object-fit:cover;display:block}
.fcard .cover svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6}
.fcard b{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard small{font-size:12px;color:var(--muted)}
.ahead{display:flex;flex-direction:column;gap:10px}
.ahead .btn.ghost{align-self:flex-start}
.bigpick{display:grid;gap:10px}
.bigpick .btn{justify-content:center;gap:8px}
.bigpick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
/* 앨범에 넣을 사진 고르기 */
.pkm{font-size:14px;font-weight:800;margin:12px 0 6px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.pk{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface-2);cursor:pointer;display:block}
.pk input[type=checkbox]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:2}
.pk img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s,opacity .15s}
.pk i{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(10,12,22,.35);color:transparent;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px}
.pk small{position:absolute;left:5px;bottom:4px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.pk:has(input:checked) img{transform:scale(.9);border-radius:10px}
.pk:has(input:checked){background:color-mix(in srgb,var(--accent) 22%,var(--surface-2))}
.pk:has(input:checked) i{background:var(--accent);color:#fff}
.pk:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
/* 같은 사진 표시 */
.picks span.dup img{opacity:.35;filter:grayscale(1)}
.picks .dupt{position:absolute;left:3px;right:3px;bottom:3px;top:auto;width:auto;height:auto;border-radius:6px;font-size:9.5px;line-height:1.2;padding:2px 3px;background:rgba(180,35,24,.9)}
.picks .dupt[aria-pressed="true"]{background:rgba(10,125,10,.9)}
.picks .dupnote{flex-basis:100%;margin:2px 0 0}
/* 사진 달력 */
.pgridcal{gap:4px}
.pday{position:relative;aspect-ratio:1;border:0;border-radius:10px;background:var(--surface-2);padding:0;overflow:hidden;color:var(--ink-2)}
.pday .dn{position:absolute;left:5px;top:3px;font-size:12px;font-weight:700;z-index:1}
.pday.has .dn{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
.pday img{width:100%;height:100%;object-fit:cover;display:block}
.pday em{position:absolute;right:4px;bottom:4px;font-style:normal;font-size:11px;font-weight:800;color:#fff;background:rgba(10,12,22,.62);border-radius:999px;padding:0 6px;line-height:17px}
.pday.out{opacity:.35}
.pday.today{box-shadow:inset 0 0 0 2px var(--accent)}
.pday:disabled{cursor:default}
/* 여행 지도 */
.tripbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tripbar .months{gap:6px}
.tripbar input[type=month]{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.regs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.regs .chip{flex:0 0 auto}
.mapbox{position:relative;border-radius:16px;overflow:hidden;background:var(--map-sea,#cfe6f3);border:1px solid var(--line)}
.tmap{display:block;width:100%;height:auto;aspect-ratio:1.75;--ms:2.8;touch-action:manipulation}
.tmap .tsea{fill:var(--map-sea,#cfe6f3)}
.tmap .tlands path{fill:var(--map-land,#f4efe3);stroke:var(--map-line,#b9b2a2);stroke-width:calc(var(--ms) * .6);stroke-linejoin:round;cursor:pointer;transition:fill .2s}
.tmap .tlands path:hover{fill:var(--map-hover,#ebe2cc)}
.tmap .tlands path.tvis{fill:var(--map-vis,#ffd7a8)}
.tmap .tlands path.tsel{fill:var(--map-sel,#ffc27a);stroke:var(--ink);stroke-width:calc(var(--ms) * 1.2)}
.tmap.tmini{aspect-ratio:1.75;border-radius:14px;cursor:crosshair}
.tmap.tmini .tlands path{cursor:crosshair}
.tmap.tmini .tlands path:not(.tsel){fill:color-mix(in srgb,var(--map-land,#f4efe3) 70%,var(--map-sea,#cfe6f3))}
.tmap .tmk{fill:var(--accent);stroke:#fff;stroke-width:1.6}
.tmap .tmkd{fill:#fff}
.tpin{cursor:pointer}
.tpin .tps{transform:scale(calc(var(--ms) * .8 * var(--zs,1)))}
/* 지도 위 여행자: 노란 다녀온 나라 위에서도 보이게 색을 조금 진하게 하고 흰 테두리를 두른다 */
.tpin .tps .tz{filter:drop-shadow(0 0 .9px #fff) drop-shadow(0 0 .9px #fff)}
.tpin .tdot{fill:var(--accent);stroke:#fff;stroke-width:1.2}
.tpin .tlbl{font-size:8.5px;font-weight:800;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:2.6px;stroke-linejoin:round}
.tpin .tmore{font-size:8px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:2.4px}
.tmap:not(.tzoom) .tpin .tlbl{display:none}
.tz{--c2:color-mix(in srgb,var(--c) 88%,#141824);fill:none;stroke:var(--c2);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tz .tzh{fill:var(--surface);stroke:var(--c2)}
.tz .tzp{fill:var(--c2);stroke:none}
.tz .tzb{animation:kTvBob .7s ease-in-out infinite;animation-delay:var(--dl)}
.tz .tzl,.tz .tza{transform-origin:0 0}
.tz .tz1{animation:kTvLeg .7s ease-in-out infinite alternate;animation-delay:var(--dl)}
.tz .tz2{animation:kTvLeg .7s ease-in-out infinite alternate-reverse;animation-delay:var(--dl)}
.tz .tza{animation:kTvArm .7s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes kTvLeg{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes kTvArm{from{transform:rotate(-30deg)}to{transform:rotate(25deg)}}
@keyframes kTvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@media (prefers-reduced-motion:reduce){.tz .tzb,.tz .tzl,.tz .tza{animation:none}}
.maploading{padding:40px 16px;text-align:center}
.triplist li{cursor:pointer}
.tavs{display:flex;flex:0 0 auto}
.tavs .av+.av{margin-left:-8px}
.tavs.big{flex-wrap:wrap;gap:8px}
.tavs.big span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tripcard{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tripcard:first-of-type{border-top:0}
.pickmap{margin-top:4px}
fieldset.trip{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
fieldset.trip legend{font-weight:800;padding:0 6px}
.f .tlbl{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.triplist li{grid-template-columns:auto minmax(0,1fr)}
.triplist .tavs{min-width:34px}
.triplist .tavs .av+.av{margin-left:-14px}

/* 여행 지도 2판: 손가락으로 다루기, 이름 칸, + − 단추 */

    code=typeof TextDecoder!=='undefined'?new TextDecoder('utf-8').decode(u):decodeURIComponent(escape(bin));
  }catch(x){say('진단 5 · 프로그램을 풀지 못했습니다: '+(x&&x.message)+' · '+ua);return}
  var s=document.createElement('script');s.text=code;
  try{document.body.appendChild(s)}catch(x2){say('진단 6 · 프로그램을 넣지 못했습니다: '+(x2&&x2.message)+' · '+ua);return}
  if(!window.__riseBooted)say('진단 7 · 프로그램이 시작되지 않았습니다: '+((window.__riseE||[]).slice(0,3).join(' | ')||'오류 내용 없음')+' · '+ua);
})();

</script>
